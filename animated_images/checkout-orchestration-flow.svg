<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" aria-labelledby="title desc">
<title id="title">API Checkout Workflow Orchestration</title>
<desc id="desc">Animated demonstration of an API Server orchestrating an atomic e-commerce checkout across Inventory, Stripe Payment, and Orders Database.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#444441}
.t{font-size:14px}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.lane{stroke:#888780;stroke-width:1;stroke-dasharray:4 4;fill:none}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.head{stroke:#888780;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot-req{fill:#EF9F27;stroke:#854F0B;stroke-width:1}
.dot-res{fill:#97C459;stroke:#3B6D11;stroke-width:1}
.hl,.pkt,.cap{opacity:0}
.cap.static{opacity:1}
@media (prefers-color-scheme: dark){
text{fill:#D3D1C7}
.ts{fill:#B4B2A9}
.gray rect{fill:#444441;stroke:#B4B2A9}
.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}
.purple rect{fill:#3C3489;stroke:#AFA9EC}
.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}
.teal rect{fill:#085041;stroke:#5DCAA5}
.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}
.lane,.arr,.head{stroke:#9C9A92}
.dot-req{stroke:#FAC775}
.dot-res{stroke:#C0DD97}
}
@media (prefers-reduced-motion: no-preference){
.cap.static{display:none}
.pkt-req{animation:req 12s linear infinite}
.pkt-res{animation:res 12s linear infinite}
.hl1{animation:h1 12s linear infinite}
.hl2{animation:h2 12s linear infinite}
.hl3{animation:h3 12s linear infinite}
.hl4{animation:h4 12s linear infinite}
.hl5{animation:h5 12s linear infinite}
.c1{animation:k1 12s linear infinite}
.c2{animation:k2 12s linear infinite}
.c3{animation:k3 12s linear infinite}
.c4{animation:k4 12s linear infinite}
.c5{animation:k5 12s linear infinite}
}
@keyframes req{
0%{transform:translate(0,0);opacity:0}
2%{transform:translate(0,0);opacity:1}
12%,16%{transform:translate(124px,0);opacity:1}
22%{transform:translate(248px,0);opacity:1}
28%,32%{transform:translate(248px,0);opacity:1}
34%{transform:translate(124px,0);opacity:1}
40%{transform:translate(372px,0);opacity:1}
46%,50%{transform:translate(372px,0);opacity:1}
54%{transform:translate(124px,0);opacity:1}
60%{transform:translate(496px,0);opacity:1}
66%,70%{transform:translate(496px,0);opacity:1}
74%{transform:translate(124px,0);opacity:1}
76%,100%{transform:translate(124px,0);opacity:0}
}
@keyframes res{
0%,75%{transform:translate(124px,0);opacity:0}
76%{transform:translate(124px,0);opacity:1}
88%,96%{transform:translate(0,0);opacity:1}
98%,100%{transform:translate(0,0);opacity:0}
}
@keyframes h1{
0%,12%{opacity:1}14%,86%{opacity:0}88%,98%{opacity:1}99%,100%{opacity:0}
}
@keyframes h2{
0%,8%{opacity:0}10%,20%{opacity:1}22%,32%{opacity:0}34%,40%{opacity:1}42%,52%{opacity:0}54%,60%{opacity:1}62%,72%{opacity:0}74%,84%{opacity:1}86%,100%{opacity:0}
}
@keyframes h3{
0%,18%{opacity:0}20%,32%{opacity:1}34%,100%{opacity:0}
}
@keyframes h4{
0%,38%{opacity:0}40%,52%{opacity:1}54%,100%{opacity:0}
}
@keyframes h5{
0%,58%{opacity:0}60%,72%{opacity:1}74%,100%{opacity:0}
}
@keyframes k1{0%,16%{opacity:1}18%,100%{opacity:0}}
@keyframes k2{0%,16%{opacity:0}18%,36%{opacity:1}38%,100%{opacity:0}}
@keyframes k3{0%,36%{opacity:0}38%,56%{opacity:1}58%,100%{opacity:0}}
@keyframes k4{0%,56%{opacity:0}58%,76%{opacity:1}78%,100%{opacity:0}}
@keyframes k5{0%,76%{opacity:0}78%,98%{opacity:1}99%,100%{opacity:0}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head" d="M2 1L8 5L2 9"/>
</marker>
</defs>

<text class="ts" x="16" y="26" dominant-baseline="central">Dispatch</text>
<line class="lane" x1="92" y1="26" x2="588" y2="26"/>
<text class="ts" x="16" y="82" dominant-baseline="central">Services</text>
<text class="ts" x="16" y="142" dominant-baseline="central">Role</text>
<text class="ts" x="16" y="192" dominant-baseline="central">Callback</text>
<line class="lane" x1="92" y1="192" x2="216" y2="192"/>

<g class="gray"><rect x="40" y="50" width="104" height="64" rx="8" stroke-width="0.5"/><text class="th" x="92" y="72" text-anchor="middle" dominant-baseline="central">Mobile App</text><text class="ts" x="92" y="94" text-anchor="middle" dominant-baseline="central">Customer client</text></g>
<g class="purple"><rect x="164" y="50" width="104" height="64" rx="8" stroke-width="0.5"/><text class="th" x="216" y="72" text-anchor="middle" dominant-baseline="central">API Server</text><text class="ts" x="216" y="94" text-anchor="middle" dominant-baseline="central">Orchestrator</text></g>
<g class="teal"><rect x="288" y="50" width="104" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Inventory</text><text class="ts" x="340" y="94" text-anchor="middle" dominant-baseline="central">Stock lock</text></g>
<g class="teal"><rect x="412" y="50" width="104" height="64" rx="8" stroke-width="0.5"/><text class="th" x="464" y="72" text-anchor="middle" dominant-baseline="central">Stripe</text><text class="ts" x="464" y="94" text-anchor="middle" dominant-baseline="central">Payment gate</text></g>
<g class="teal"><rect x="536" y="50" width="104" height="64" rx="8" stroke-width="0.5"/><text class="th" x="588" y="72" text-anchor="middle" dominant-baseline="central">Orders DB</text><text class="ts" x="588" y="94" text-anchor="middle" dominant-baseline="central">Atomic record</text></g>

<line class="arr" x1="146" y1="82" x2="162" y2="82" marker-end="url(#arrow)"/>
<line class="arr" x1="270" y1="82" x2="286" y2="82" marker-end="url(#arrow)"/>
<line class="arr" x1="394" y1="82" x2="410" y2="82" marker-end="url(#arrow)"/>
<line class="arr" x1="518" y1="82" x2="534" y2="82" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="124" width="104" height="36" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="92" y="142" text-anchor="middle" dominant-baseline="central">Checkout call</text></g>
<g class="purple"><rect x="164" y="124" width="104" height="36" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="216" y="142" text-anchor="middle" dominant-baseline="central">Saga manager</text></g>
<g class="teal"><rect x="288" y="124" width="104" height="36" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">Lock 1x item</text></g>
<g class="teal"><rect x="412" y="124" width="104" height="36" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="464" y="142" text-anchor="middle" dominant-baseline="central">Charge card</text></g>
<g class="teal"><rect x="536" y="124" width="104" height="36" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="588" y="142" text-anchor="middle" dominant-baseline="central">INSERT order</text></g>

<rect class="hl hl1" x="40" y="50" width="104" height="64" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect class="hl hl2" x="164" y="50" width="104" height="64" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect class="hl hl3" x="288" y="50" width="104" height="64" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect class="hl hl4" x="412" y="50" width="104" height="64" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>
<rect class="hl hl5" x="536" y="50" width="104" height="64" rx="8" fill="none" stroke="#EF9F27" stroke-width="2.5"/>

<g class="pkt pkt-req"><circle class="dot-req" cx="92" cy="26" r="7"/></g>
<g class="pkt pkt-res"><circle class="dot-res" cx="92" cy="192" r="7"/></g>

<text class="t cap static" x="340" y="246" text-anchor="middle">The API orchestrator coordinates stock lock, payment charge, and DB write atomically.</text>
<text class="t cap c1" x="340" y="246" text-anchor="middle">1. Mobile App calls POST /v1/checkout to begin atomic purchase.</text>
<text class="t cap c2" x="340" y="246" text-anchor="middle">2. API Server locks 1x Laptop in Inventory to prevent double-selling.</text>
<text class="t cap c3" x="340" y="246" text-anchor="middle">3. API Server charges payment card via Stripe (rolls back if declined).</text>
<text class="t cap c4" x="340" y="246" text-anchor="middle">4. Payment confirmed; API commits order into Orders DB atomically.</text>
<text class="t cap c5" x="340" y="246" text-anchor="middle">5. API Server returns HTTP 201 Created and enqueues async receipt email.</text>
</svg>
