<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">Animated Checkout Sequence Diagram</title>
<desc id="desc">Animated sequence diagram of an e-commerce checkout flow across Mobile App, API Server, Inventory Service, and Stripe Payment Gateway.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#444441}
.t{font-size:14px}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.lifeline{stroke:#888780;stroke-width:1;stroke-dasharray:4 4;fill:none}
.arr-req{stroke:#444441;stroke-width:1.5;fill:none}
.arr-res{stroke:#5F5E5A;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.head-req{stroke:#444441;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.head-res{stroke:#5F5E5A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot-amber{fill:#EF9F27;stroke:#854F0B;stroke-width:1}
.msg,.dot-amber,.cap{opacity:0}
.cap.static{opacity:1}
@media (prefers-color-scheme: dark){
text{fill:#D3D1C7}
.ts{fill:#B4B2A9}
.gray rect{fill:#444441;stroke:#B4B2A9}
.gray .th{fill:#D3D1C7}.gray .ts{fill:#B4B2A9}
.purple rect{fill:#3C3489;stroke:#AFA9EC}
.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}
.teal rect{fill:#085041;stroke:#5DCAA5}
.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}
.lifeline{stroke:#68665E}
.arr-req{stroke:#D3D1C7}
.arr-res{stroke:#B4B2A9}
.head-req{stroke:#D3D1C7}
.head-res{stroke:#B4B2A9}
.dot-amber{stroke:#FAC775}
}
@media (prefers-reduced-motion: no-preference){
.cap.static{display:none}
.dot-amber{animation:dotPath 12s linear infinite}
.m1{animation:msg1 12s linear infinite}
.m2{animation:msg2 12s linear infinite}
.m3{animation:msg3 12s linear infinite}
.m4{animation:msg4 12s linear infinite}
.m5{animation:msg5 12s linear infinite}
.m6{animation:msg6 12s linear infinite}
.c1{animation:cap1 12s linear infinite}
.c2{animation:cap2 12s linear infinite}
.c3{animation:cap3 12s linear infinite}
.c4{animation:cap4 12s linear infinite}
.c5{animation:cap5 12s linear infinite}
.c6{animation:cap6 12s linear infinite}
}
@keyframes dotPath{
0%{transform:translate(0,0);opacity:0}
1%{transform:translate(0,0);opacity:1}
12%,15%{transform:translate(140px,0);opacity:1}
17%{transform:translate(140px,40px);opacity:1}
29%,32%{transform:translate(280px,40px);opacity:1}
34%{transform:translate(280px,80px);opacity:1}
46%,49%{transform:translate(140px,80px);opacity:1}
51%{transform:translate(140px,120px);opacity:1}
63%,66%{transform:translate(420px,120px);opacity:1}
68%{transform:translate(420px,160px);opacity:1}
80%,83%{transform:translate(140px,160px);opacity:1}
85%{transform:translate(140px,200px);opacity:1}
94%,96%{transform:translate(0,200px);opacity:1}
98%,100%{transform:translate(0,200px);opacity:0}
}
@keyframes msg1{0%,10%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes msg2{0%,16%{opacity:0}18%,26%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes msg3{0%,33%{opacity:0}35%,43%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes msg4{0%,50%{opacity:0}52%,60%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes msg5{0%,67%{opacity:0}69%,77%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes msg6{0%,84%{opacity:0}86%,94%{opacity:1}96%{opacity:1}98%,100%{opacity:0}}
@keyframes cap1{0%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes cap2{0%,16%{opacity:0}17%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes cap3{0%,33%{opacity:0}34%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes cap4{0%,50%{opacity:0}51%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes cap5{0%,67%{opacity:0}68%,83%{opacity:1}84%,100%{opacity:0}}
@keyframes cap6{0%,84%{opacity:0}85%,96%{opacity:1}97%,100%{opacity:0}}
</style>
<defs>
<marker id="arr-r-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-req" d="M2 1L8 5L2 9"/>
</marker>
<marker id="arr-l-res" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-res" d="M8 1L2 5L8 9"/>
</marker>
</defs>

<!-- Lifelines running vertically down from participant centers -->
<line class="lifeline" x1="160" y1="76" x2="160" y2="346"/>
<line class="lifeline" x1="300" y1="76" x2="300" y2="346"/>
<line class="lifeline" x1="440" y1="76" x2="440" y2="346"/>
<line class="lifeline" x1="580" y1="76" x2="580" y2="346"/>

<!-- Participant Boxes across top (120px wide, 20px gaps, centers at 160 + 140*i) -->
<g class="gray"><rect x="100" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="160" y="42" text-anchor="middle" dominant-baseline="central">Mobile App</text><text class="ts" x="160" y="60" text-anchor="middle" dominant-baseline="central">Customer</text></g>
<g class="purple"><rect x="240" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300" y="42" text-anchor="middle" dominant-baseline="central">API Server</text><text class="ts" x="300" y="60" text-anchor="middle" dominant-baseline="central">Orchestrator</text></g>
<g class="teal"><rect x="380" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="440" y="42" text-anchor="middle" dominant-baseline="central">Inventory</text><text class="ts" x="440" y="60" text-anchor="middle" dominant-baseline="central">Warehouse</text></g>
<g class="teal"><rect x="520" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="580" y="42" text-anchor="middle" dominant-baseline="central">Stripe</text><text class="ts" x="580" y="60" text-anchor="middle" dominant-baseline="central">Payment Gate</text></g>

<!-- Message 1: Request (solid 1.5px arrow, y = 120) -->
<g class="msg m1">
<text class="ts" x="230" y="110" text-anchor="middle">POST /v1/checkout</text>
<line class="arr-req" x1="162" y1="120" x2="298" y2="120" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 2: Request (solid 1.5px arrow, y = 160) -->
<g class="msg m2">
<text class="ts" x="370" y="150" text-anchor="middle">Reserve 1x Laptop (lock stock)</text>
<line class="arr-req" x1="302" y1="160" x2="438" y2="160" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 3: Response (dashed 1.5px arrow pointing back, y = 200) -->
<g class="msg m3">
<text class="ts" x="370" y="190" text-anchor="middle">Stock reserved</text>
<line class="arr-res" x1="438" y1="200" x2="302" y2="200" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 4: Request (solid 1.5px arrow, y = 240) -->
<g class="msg m4">
<text class="ts" x="440" y="230" text-anchor="middle">Charge 1,200 USD to card</text>
<line class="arr-req" x1="302" y1="240" x2="578" y2="240" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 5: Response (dashed 1.5px arrow pointing back, y = 280) -->
<g class="msg m5">
<text class="ts" x="440" y="270" text-anchor="middle">Charge success (ch_9921)</text>
<line class="arr-res" x1="578" y1="280" x2="302" y2="280" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 6: Response (dashed 1.5px arrow pointing back, y = 320) -->
<g class="msg m6">
<text class="ts" x="230" y="310" text-anchor="middle">HTTP 201 Created (Order #ORD-882)</text>
<line class="arr-res" x1="298" y1="320" x2="162" y2="320" marker-end="url(#arr-l-res)"/>
</g>

<!-- One continuous amber dot following full message path -->
<circle class="dot-amber" cx="160" cy="120" r="5.5"/>

<!-- Captions changing at each message -->
<text class="t cap static" x="340" y="380" text-anchor="middle">The API Server orchestrates stock lock, payment charge, and client confirmation.</text>
<text class="t cap c1" x="340" y="380" text-anchor="middle">1. Mobile App sends POST /v1/checkout to begin atomic purchase.</text>
<text class="t cap c2" x="340" y="380" text-anchor="middle">2. API Server locks 1x Laptop in Inventory Service.</text>
<text class="t cap c3" x="340" y="380" text-anchor="middle">3. Inventory Service confirms stock is securely reserved.</text>
<text class="t cap c4" x="340" y="380" text-anchor="middle">4. API Server charges 1,200 USD via Stripe payment gateway.</text>
<text class="t cap c5" x="340" y="380" text-anchor="middle">5. Stripe payment gateway confirms charge authorization success.</text>
<text class="t cap c6" x="340" y="380" text-anchor="middle">6. API Server returns HTTP 201 Created to Mobile App.</text>
</svg>