<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 710" width="100%" height="auto" role="img" aria-labelledby="title desc">
<title id="title">Animated E-Commerce Checkout Sequence Diagram</title>
<desc id="desc">Animated sequence diagram illustrating complete e-commerce checkout orchestration with alternative card declined and succeeded branches across Mobile App, API Server, Inventory, Stripe, Orders DB, and Notification Worker.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#444441}
.t{font-size:14px}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500}
.badge-txt{font-size:11px;font-weight:600;fill:#FFFFFF}

.gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}

.purple rect{fill:#EEEDFE;stroke:#534AB7}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}

.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}

.coral rect{fill:#FAECE7;stroke:#D85A38}
.coral .th{fill:#993C1D}.coral .ts{fill:#D85A38}

.blue rect{fill:#EBF3FE;stroke:#378ADD}
.blue .th{fill:#185ABC}.blue .ts{fill:#378ADD}

.amber rect{fill:#FEF7E0;stroke:#B06000}
.amber .th{fill:#7A4100}.amber .ts{fill:#B06000}

.lifeline{stroke:#888780;stroke-width:1;stroke-dasharray:4 4;fill:none}
.arr-req{stroke:#444441;stroke-width:1.5;fill:none}
.arr-res{stroke:#5F5E5A;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.head-req{stroke:#444441;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.head-res{stroke:#5F5E5A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.step-badge{fill:#378ADD;stroke:#185ABC;stroke-width:1}
.dot-amber{fill:#EF9F27;stroke:#854F0B;stroke-width:1.5}

.alt-frame{stroke:#378ADD;stroke-width:1;stroke-dasharray:4 4;fill:rgba(235,243,254,0.15)}
.alt-badge{fill:#EBF3FE;stroke:#378ADD;stroke-width:1}
.alt-txt{font-size:12px;font-weight:700;fill:#185ABC}
.alt-cond-dec{font-size:12px;font-weight:600;fill:#D9381E}
.alt-cond-suc{font-size:12px;font-weight:600;fill:#0F6E56}
.alt-divider{stroke:#378ADD;stroke-width:1;stroke-dasharray:4 4}

.msg,.dot-amber,.cap{opacity:0}
.cap.static{opacity:1}

@media (prefers-color-scheme: dark){
text{fill:#D3D1C7}
.ts{fill:#B4B2A9}
.gray rect{fill:#353432;stroke:#888780}
.gray .th{fill:#E3E1D8}.gray .ts{fill:#B4B2A9}

.purple rect{fill:#2C2654;stroke:#7F77DD}
.purple .th{fill:#CECBF6}.purple .ts{fill:#AFA9EC}

.teal rect{fill:#063D31;stroke:#3B9E7F}
.teal .th{fill:#9FE1CB}.teal .ts{fill:#5DCAA5}

.coral rect{fill:#4D1F13;stroke:#E27B58}
.coral .th{fill:#F6B39E}.coral .ts{fill:#F0997D}

.blue rect{fill:#12345A;stroke:#669DF6}
.blue .th{fill:#AECBFA}.blue .ts{fill:#8AB4F8}

.amber rect{fill:#483204;stroke:#E3A024}
.amber .th{fill:#FDE293}.amber .ts{fill:#FDD663}

.lifeline{stroke:#55544E}
.arr-req{stroke:#D3D1C7}
.arr-res{stroke:#B4B2A9}
.head-req{stroke:#D3D1C7}
.head-res{stroke:#B4B2A9}
.step-badge{fill:#1A73E8;stroke:#8AB4F8}
.dot-amber{stroke:#FAC775}
.alt-frame{stroke:#669DF6;fill:rgba(18,52,90,0.25)}
.alt-badge{fill:#174EA6;stroke:#8AB4F8}
.alt-txt{fill:#AECBFA}
.alt-cond-dec{fill:#F28B82}
.alt-cond-suc{fill:#81C995}
.alt-divider{stroke:#669DF6}
}

@media (prefers-reduced-motion: no-preference){
.cap.static{display:none}
.dot-amber{animation:dotPath 18s linear infinite}
.m1{animation:msg1 18s linear infinite}
.m2{animation:msg2 18s linear infinite}
.m3{animation:msg3 18s linear infinite}
.m4{animation:msg4 18s linear infinite}
.m5{animation:msg5 18s linear infinite}
.m6{animation:msg6 18s linear infinite}
.m7{animation:msg7 18s linear infinite}
.m8{animation:msg8 18s linear infinite}
.m9{animation:msg9 18s linear infinite}
.m10{animation:msg10 18s linear infinite}
.m11{animation:msg11 18s linear infinite}
.m12{animation:msg12 18s linear infinite}

.c1{animation:cap1 18s linear infinite}
.c2{animation:cap2 18s linear infinite}
.c3{animation:cap3 18s linear infinite}
.c4{animation:cap4 18s linear infinite}
.c5{animation:cap5 18s linear infinite}
.c6{animation:cap6 18s linear infinite}
.c7{animation:cap7 18s linear infinite}
.c8{animation:cap8 18s linear infinite}
.c9{animation:cap9 18s linear infinite}
.c10{animation:cap10 18s linear infinite}
.c11{animation:cap11 18s linear infinite}
.c12{animation:cap12 18s linear infinite}
}

@keyframes dotPath{
0%{transform:translate(0,0);opacity:0}
1%{transform:translate(0,0);opacity:1}
5%{transform:translate(140px,0);opacity:1}
6%{transform:translate(140px,40px);opacity:1}
10%{transform:translate(280px,40px);opacity:1}
11%{transform:translate(280px,80px);opacity:1}
15%{transform:translate(140px,80px);opacity:1}
16%{transform:translate(140px,120px);opacity:1}
22%{transform:translate(420px,120px);opacity:1}
24%{transform:translate(420px,180px);opacity:1}
29%{transform:translate(140px,180px);opacity:1}
30%{transform:translate(140px,220px);opacity:1}
35%{transform:translate(280px,220px);opacity:1}
36%{transform:translate(140px,260px);opacity:1}
42%{transform:translate(0,260px);opacity:1}
45%{transform:translate(0,260px);opacity:1}
46%{transform:translate(0,260px);opacity:0}
48%{transform:translate(420px,330px);opacity:0}
49%{transform:translate(420px,330px);opacity:1}
55%{transform:translate(140px,330px);opacity:1}
56%{transform:translate(140px,370px);opacity:1}
63%{transform:translate(560px,370px);opacity:1}
64%{transform:translate(560px,410px);opacity:1}
71%{transform:translate(140px,410px);opacity:1}
72%{transform:translate(140px,450px);opacity:1}
80%{transform:translate(700px,450px);opacity:1}
81%{transform:translate(140px,490px);opacity:1}
88%{transform:translate(0,490px);opacity:1}
94%{transform:translate(0,490px);opacity:1}
97%{transform:translate(0,490px);opacity:0}
100%{transform:translate(0,0);opacity:0}
}

@keyframes msg1{0%,3%{opacity:0}5%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg2{0%,8%{opacity:0}10%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg3{0%,13%{opacity:0}15%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg4{0%,20%{opacity:0}22%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg5{0%,27%{opacity:0}29%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg6{0%,33%{opacity:0}35%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg7{0%,40%{opacity:0}42%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg8{0%,53%{opacity:0}55%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg9{0%,61%{opacity:0}63%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg10{0%,69%{opacity:0}71%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg11{0%,78%{opacity:0}80%,95%{opacity:1}97%,100%{opacity:0}}
@keyframes msg12{0%,86%{opacity:0}88%,95%{opacity:1}97%,100%{opacity:0}}

@keyframes cap1{0%,5%{opacity:1}6%,100%{opacity:0}}
@keyframes cap2{0%,5%{opacity:0}6%,10%{opacity:1}11%,100%{opacity:0}}
@keyframes cap3{0%,10%{opacity:0}11%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes cap4{0%,15%{opacity:0}16%,23%{opacity:1}24%,100%{opacity:0}}
@keyframes cap5{0%,23%{opacity:0}24%,29%{opacity:1}30%,100%{opacity:0}}
@keyframes cap6{0%,29%{opacity:0}30%,35%{opacity:1}36%,100%{opacity:0}}
@keyframes cap7{0%,35%{opacity:0}36%,46%{opacity:1}47%,100%{opacity:0}}
@keyframes cap8{0%,46%{opacity:0}47%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes cap9{0%,55%{opacity:0}56%,63%{opacity:1}64%,100%{opacity:0}}
@keyframes cap10{0%,63%{opacity:0}64%,71%{opacity:1}72%,100%{opacity:0}}
@keyframes cap11{0%,71%{opacity:0}72%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes cap12{0%,80%{opacity:0}81%,95%{opacity:1}96%,100%{opacity:0}}
</style>

<defs>
<marker id="arr-r-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-req" d="M2 1L8 5L2 9"/>
</marker>
<marker id="arr-l-req" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-req" d="M8 1L2 5L8 9"/>
</marker>
<marker id="arr-r-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-res" d="M2 1L8 5L2 9"/>
</marker>
<marker id="arr-l-res" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path class="head-res" d="M8 1L2 5L8 9"/>
</marker>
</defs>

<!-- Lifelines running vertically down from participant centers -->
<line class="lifeline" x1="160" y1="76" x2="160" y2="635"/>
<line class="lifeline" x1="300" y1="76" x2="300" y2="635"/>
<line class="lifeline" x1="440" y1="76" x2="440" y2="635"/>
<line class="lifeline" x1="580" y1="76" x2="580" y2="635"/>
<line class="lifeline" x1="720" y1="76" x2="720" y2="635"/>
<line class="lifeline" x1="860" y1="76" x2="860" y2="635"/>

<!-- Participant Boxes across top (120px wide, 20px gaps, centers at 160 + 140*i) -->
<g class="gray"><rect x="100" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="160" y="42" text-anchor="middle" dominant-baseline="central">Mobile App</text><text class="ts" x="160" y="60" text-anchor="middle" dominant-baseline="central">Customer</text></g>
<g class="purple"><rect x="240" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="300" y="42" text-anchor="middle" dominant-baseline="central">API Server</text><text class="ts" x="300" y="60" text-anchor="middle" dominant-baseline="central">Checkout Orchestrator</text></g>
<g class="teal"><rect x="380" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="440" y="42" text-anchor="middle" dominant-baseline="central">Inventory Service</text><text class="ts" x="440" y="60" text-anchor="middle" dominant-baseline="central">Stock Mgmt</text></g>
<g class="coral"><rect x="520" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="580" y="42" text-anchor="middle" dominant-baseline="central">Payment Gateway</text><text class="ts" x="580" y="60" text-anchor="middle" dominant-baseline="central">Stripe</text></g>
<g class="blue"><rect x="660" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="720" y="42" text-anchor="middle" dominant-baseline="central">Orders Database</text><text class="ts" x="720" y="60" text-anchor="middle" dominant-baseline="central">Persistence</text></g>
<g class="amber"><rect x="800" y="24" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="860" y="42" text-anchor="middle" dominant-baseline="central">Notification Worker</text><text class="ts" x="860" y="60" text-anchor="middle" dominant-baseline="central">Async Worker</text></g>

<!-- Message 1: Request (solid 1.5px arrow, y = 120) -->
<g class="msg m1">
<circle class="step-badge" cx="160" cy="120" r="9"/>
<text class="badge-txt" x="160" y="120" text-anchor="middle" dominant-baseline="central">1</text>
<text class="ts" x="230" y="108" text-anchor="middle">POST /v1/checkout (items, address, paymentMethod)</text>
<line class="arr-req" x1="172" y1="120" x2="298" y2="120" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 2: Request (solid 1.5px arrow, y = 160) -->
<g class="msg m2">
<circle class="step-badge" cx="300" cy="160" r="9"/>
<text class="badge-txt" x="300" y="160" text-anchor="middle" dominant-baseline="central">2</text>
<text class="ts" x="370" y="148" text-anchor="middle">Reserve 1x Laptop (Lock Stock)</text>
<line class="arr-req" x1="312" y1="160" x2="438" y2="160" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 3: Response (dashed 1.5px arrow pointing back, y = 200) -->
<g class="msg m3">
<circle class="step-badge" cx="440" cy="200" r="9"/>
<text class="badge-txt" x="440" y="200" text-anchor="middle" dominant-baseline="central">3</text>
<text class="ts" x="370" y="188" text-anchor="middle">Stock Reserved</text>
<line class="arr-res" x1="428" y1="200" x2="302" y2="200" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 4: Request (solid 1.5px arrow, y = 240) -->
<g class="msg m4">
<circle class="step-badge" cx="300" cy="240" r="9"/>
<text class="badge-txt" x="300" y="240" text-anchor="middle" dominant-baseline="central">4</text>
<text class="ts" x="440" y="228" text-anchor="middle">Charge $1,200 to Card</text>
<line class="arr-req" x1="312" y1="240" x2="578" y2="240" marker-end="url(#arr-r-req)"/>
</g>

<!-- ALT FRAME: Alternative Block (Card Declined vs Card Succeeded) -->
<rect class="alt-frame" x="80" y="265" width="860" height="360" rx="4"/>
<rect class="alt-badge" x="80" y="265" width="36" height="20" rx="3"/>
<text class="alt-txt" x="98" y="278" text-anchor="middle" dominant-baseline="central">alt</text>

<!-- Branch 1: Card Declined -->
<text class="alt-cond-dec" x="125" y="280">[Card Declined]</text>

<!-- Message 5: Response (dashed 1.5px arrow, y = 300) -->
<g class="msg m5">
<circle class="step-badge" cx="580" cy="300" r="9"/>
<text class="badge-txt" x="580" y="300" text-anchor="middle" dominant-baseline="central">5</text>
<text class="ts" x="440" y="288" text-anchor="middle">402 Card Declined</text>
<line class="arr-res" x1="568" y1="300" x2="302" y2="300" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 6: Request (solid 1.5px arrow, y = 340) -->
<g class="msg m6">
<circle class="step-badge" cx="300" cy="340" r="9"/>
<text class="badge-txt" x="300" y="340" text-anchor="middle" dominant-baseline="central">6</text>
<text class="ts" x="370" y="328" text-anchor="middle">Release Laptop Reservation</text>
<line class="arr-req" x1="312" y1="340" x2="438" y2="340" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 7: Response (dashed 1.5px arrow, y = 380) -->
<g class="msg m7">
<circle class="step-badge" cx="300" cy="380" r="9"/>
<text class="badge-txt" x="300" y="380" text-anchor="middle" dominant-baseline="central">7</text>
<text class="ts" x="230" y="368" text-anchor="middle">HTTP 402 ("Card Declined: Insufficient Funds")</text>
<line class="arr-res" x1="288" y1="380" x2="162" y2="380" marker-end="url(#arr-l-res)"/>
</g>

<!-- Branch Divider -->
<line class="alt-divider" x1="80" y1="415" x2="940" y2="415"/>

<!-- Branch 2: Card Succeeded -->
<text class="alt-cond-suc" x="125" y="432">[Card Succeeded]</text>

<!-- Message 8: Response (dashed 1.5px arrow, y = 450) -->
<g class="msg m8">
<circle class="step-badge" cx="580" cy="450" r="9"/>
<text class="badge-txt" x="580" y="450" text-anchor="middle" dominant-baseline="central">8</text>
<text class="ts" x="440" y="438" text-anchor="middle">Charge Success (ch_9921)</text>
<line class="arr-res" x1="568" y1="450" x2="302" y2="450" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 9: Request (solid 1.5px arrow, y = 490) -->
<g class="msg m9">
<circle class="step-badge" cx="300" cy="490" r="9"/>
<text class="badge-txt" x="300" y="490" text-anchor="middle" dominant-baseline="central">9</text>
<text class="ts" x="510" y="478" text-anchor="middle">INSERT INTO orders (...)</text>
<line class="arr-req" x1="312" y1="490" x2="718" y2="490" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 10: Response (dashed 1.5px arrow, y = 530) -->
<g class="msg m10">
<circle class="step-badge" cx="720" cy="530" r="9"/>
<text class="badge-txt" x="720" y="530" text-anchor="middle" dominant-baseline="central">10</text>
<text class="ts" x="510" y="518" text-anchor="middle">Order Saved (ord_4492)</text>
<line class="arr-res" x1="708" y1="530" x2="302" y2="530" marker-end="url(#arr-l-res)"/>
</g>

<!-- Message 11: Request (solid 1.5px arrow, y = 570) -->
<g class="msg m11">
<circle class="step-badge" cx="300" cy="570" r="9"/>
<text class="badge-txt" x="300" y="570" text-anchor="middle" dominant-baseline="central">11</text>
<text class="ts" x="580" y="558" text-anchor="middle">Enqueue async receipt email</text>
<line class="arr-req" x1="312" y1="570" x2="858" y2="570" marker-end="url(#arr-r-req)"/>
</g>

<!-- Message 12: Response (dashed 1.5px arrow, y = 610) -->
<g class="msg m12">
<circle class="step-badge" cx="300" cy="610" r="9"/>
<text class="badge-txt" x="300" y="610" text-anchor="middle" dominant-baseline="central">12</text>
<text class="ts" x="230" y="598" text-anchor="middle">HTTP 201 Created (Order ord_4492 Confirmed)</text>
<line class="arr-res" x1="288" y1="610" x2="162" y2="610" marker-end="url(#arr-l-res)"/>
</g>

<!-- One continuous amber dot following full message path -->
<circle class="dot-amber" cx="160" cy="120" r="6"/>

<!-- Dynamic and static captions -->
<text class="t cap static" x="490" y="685" text-anchor="middle">E-Commerce Checkout Sequence Orchestration with compensating rollback and async event publication.</text>
<text class="t cap c1" x="490" y="685" text-anchor="middle">1. Mobile App submits checkout request: POST /v1/checkout.</text>
<text class="t cap c2" x="490" y="685" text-anchor="middle">2. API Server locks stock with Inventory Service (Reserve 1x Laptop).</text>
<text class="t cap c3" x="490" y="685" text-anchor="middle">3. Inventory Service confirms stock hold.</text>
<text class="t cap c4" x="490" y="685" text-anchor="middle">4. API Server requests card authorization of $1,200 via Stripe.</text>
<text class="t cap c5" x="490" y="685" text-anchor="middle">5. [Branch 1: Card Declined] Stripe returns 402 Card Declined.</text>
<text class="t cap c6" x="490" y="685" text-anchor="middle">6. API Server executes compensating rollback to release reserved laptop.</text>
<text class="t cap c7" x="490" y="685" text-anchor="middle">7. API Server returns HTTP 402 ("Card Declined: Insufficient Funds") to Mobile App.</text>
<text class="t cap c8" x="490" y="685" text-anchor="middle">8. [Branch 2: Card Succeeded] Stripe returns Charge Success (ch_9921).</text>
<text class="t cap c9" x="490" y="685" text-anchor="middle">9. API Server persists order record into Orders Database.</text>
<text class="t cap c10" x="490" y="685" text-anchor="middle">10. Orders Database confirms record write (ord_4492).</text>
<text class="t cap c11" x="490" y="685" text-anchor="middle">11. API Server enqueues asynchronous customer receipt email to Notification Worker.</text>
<text class="t cap c12" x="490" y="685" text-anchor="middle">12. API Server returns HTTP 201 Created (Order ord_4492 Confirmed) to Mobile App.</text>
</svg>
