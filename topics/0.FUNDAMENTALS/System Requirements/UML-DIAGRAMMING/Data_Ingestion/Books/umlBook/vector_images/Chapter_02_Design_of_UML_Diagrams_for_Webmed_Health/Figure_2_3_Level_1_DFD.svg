<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" role="img" aria-labelledby="title desc">
<title id="title">DFD Level 1 Decomposition: Webmed Healthcare</title>
<desc id="desc">Level 1 data flow diagram decomposing Webmed Healthcare into sub-processes and persistent datastores.</desc>
<style>

text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.ts { font-size: 12px; fill: #5F5E5A; text-anchor: middle; dominant-baseline: central; }
.t-left { text-anchor: start; dominant-baseline: central; }
.lbl { font-size: 11px; fill: #5F5E5A; }
.badge { font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
.box { rx: 8px; stroke-width: 1px; }

.gray rect { fill: #F4F3EF; stroke: #888780; }
.gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }

.purple rect { fill: #EEEDFE; stroke: #534AB7; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }

.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }

.coral rect { fill: #FAECE7; stroke: #D85A38; }
.coral .th { fill: #993C1D; } .coral .ts { fill: #D85A38; }

.blue rect { fill: #EBF3FE; stroke: #378ADD; }
.blue .th { fill: #185ABC; } .blue .ts { fill: #378ADD; }

.amber rect { fill: #FEF7E0; stroke: #B06000; }
.amber .th { fill: #7A4100; } .amber .ts { fill: #B06000; }

.flow-line { stroke: #444441; stroke-width: 1.5; fill: none; }
.flow-dashed { stroke: #5F5E5A; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
.lifeline { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
.frame-box { stroke: #378ADD; stroke-width: 1; stroke-dasharray: 4 4; fill: rgba(235,243,254,0.12); rx: 6px; }
.actor-line { stroke: #378ADD; stroke-width: 1.5; fill: none; stroke-linecap: round; }

@media (prefers-color-scheme: dark) {
  text { fill: #E3E1D8; }
  .ts { fill: #B4B2A9; }
  .lbl { fill: #B4B2A9; }
  .gray rect { fill: #2B2A27; stroke: #6B6963; }
  .gray .th { fill: #E3E1D8; } .gray .ts { fill: #B4B2A9; }
  
  .purple rect { fill: #26214A; stroke: #7F77DD; }
  .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
  
  .teal rect { fill: #053329; stroke: #3B9E7F; }
  .teal .th { fill: #9FE1CB; } .teal .ts { fill: #5DCAA5; }
  
  .coral rect { fill: #421A10; stroke: #E27B58; }
  .coral .th { fill: #F6B39E; } .coral .ts { fill: #F0997D; }
  
  .blue rect { fill: #0F2B4A; stroke: #669DF6; }
  .blue .th { fill: #AECBFA; } .blue .ts { fill: #8AB4F8; }
  
  .amber rect { fill: #3D2B03; stroke: #E3A024; }
  .amber .th { fill: #FDE293; } .amber .ts { fill: #FDD663; }
  
  .flow-line { stroke: #D3D1C7; }
  .flow-dashed { stroke: #B4B2A9; }
  .lifeline { stroke: #55544E; }
  .frame-box { stroke: #669DF6; fill: rgba(18,52,90,0.25); }
  .actor-line { stroke: #669DF6; }
}


</style>

<defs>
<marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M8 1L2 5L8 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<polygon points="2,1 8,5 2,9" fill="#444441"/>
</marker>
<marker id="arr-inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
<polygon points="2,2 10,6 2,10" fill="#FFFFFF" stroke="#444441" stroke-width="1.5"/>
</marker>
</defs>

<rect class="frame-box" x="20" y="20" width="720" height="440"/><text class="th t-left" x="35" y="45">LEVEL 1 DFD: SUB-PROCESS ARCHITECTURE (WEBMED HEALTHCARE)</text><g class="purple"><rect class="box" x="70" y="80" width="280" height="70"/><circle cx="95" cy="115" r="14" fill="#534AB7"/><text class="badge" x="95" y="115">1.0</text><text class="th t-left" x="120" y="108">Patient Registration &amp; A</text><text class="ts t-left" x="120" y="128">Process 1.0</text></g><g class="purple"><rect class="box" x="410" y="80" width="280" height="70"/><circle cx="435" cy="115" r="14" fill="#534AB7"/><text class="badge" x="435" y="115">2.0</text><text class="th t-left" x="460" y="108">Health A-Z Disease Looku</text><text class="ts t-left" x="460" y="128">Process 2.0</text></g><g class="purple"><rect class="box" x="70" y="180" width="280" height="70"/><circle cx="95" cy="215" r="14" fill="#534AB7"/><text class="badge" x="95" y="215">3.0</text><text class="th t-left" x="120" y="208">Doctor Consultation Sche</text><text class="ts t-left" x="120" y="228">Process 3.0</text></g><g class="purple"><rect class="box" x="410" y="180" width="280" height="70"/><circle cx="435" cy="215" r="14" fill="#534AB7"/><text class="badge" x="435" y="215">4.0</text><text class="th t-left" x="460" y="208">Online Pharmacy &amp; Medici</text><text class="ts t-left" x="460" y="228">Process 4.0</text></g><g class="purple"><rect class="box" x="70" y="280" width="280" height="70"/><circle cx="95" cy="315" r="14" fill="#534AB7"/><text class="badge" x="95" y="315">5.0</text><text class="th t-left" x="120" y="308">Finance &amp; Insurance Veri</text><text class="ts t-left" x="120" y="328">Process 5.0</text></g><g class="purple"><rect class="box" x="410" y="280" width="280" height="70"/><circle cx="435" cy="315" r="14" fill="#534AB7"/><text class="badge" x="435" y="315">6.0</text><text class="th t-left" x="460" y="308">Billing Settlement &amp; Pay</text><text class="ts t-left" x="460" y="328">Process 6.0</text></g><g class="gray"><rect class="box" x="70" y="380" width="125" height="55"/><text class="th" x="132" y="400">D1</text><text class="lbl" x="132" y="420" text-anchor="middle">User Accounts</text></g><g class="gray"><rect class="box" x="235" y="380" width="125" height="55"/><text class="th" x="297" y="400">D2</text><text class="lbl" x="297" y="420" text-anchor="middle">Doctor Directo</text></g><g class="gray"><rect class="box" x="400" y="380" width="125" height="55"/><text class="th" x="462" y="400">D3</text><text class="lbl" x="462" y="420" text-anchor="middle">Disease DB</text></g><g class="gray"><rect class="box" x="565" y="380" width="125" height="55"/><text class="th" x="627" y="400">D4</text><text class="lbl" x="627" y="420" text-anchor="middle">Pharmacy Stock</text></g><line class="flow-dashed" x1="130" y1="350" x2="130" y2="380" marker-end="url(#arr-r)"/><line class="flow-dashed" x1="300" y1="350" x2="300" y2="380" marker-end="url(#arr-r)"/><line class="flow-dashed" x1="460" y1="350" x2="460" y2="380" marker-end="url(#arr-r)"/><line class="flow-dashed" x1="620" y1="350" x2="620" y2="380" marker-end="url(#arr-r)"/></svg>