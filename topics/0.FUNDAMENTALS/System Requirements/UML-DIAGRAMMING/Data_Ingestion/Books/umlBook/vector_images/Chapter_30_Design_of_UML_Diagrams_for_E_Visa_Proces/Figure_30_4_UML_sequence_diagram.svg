<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 435" width="100%" height="auto" role="img" aria-labelledby="title desc">
<title id="title">E-Visa Verification &amp; Issuance Sequence</title>
<desc id="desc">Canonical Claude animated sequence diagram for E-Visa Processing System showing dynamic message passing.</desc>
<style>

text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.ts { font-size: 12px; fill: #5F5E5A; text-anchor: middle; dominant-baseline: central; }
.t-left { text-anchor: start; dominant-baseline: central; }
.lbl { font-size: 11px; fill: #5F5E5A; }
.badge { font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
.box { rx: 8px; stroke-width: 1px; }

.gray rect { fill: #F4F3EF; stroke: #888780; }
.gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }

.purple rect { fill: #EEEDFE; stroke: #534AB7; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }

.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }

.coral rect { fill: #FAECE7; stroke: #D85A38; }
.coral .th { fill: #993C1D; } .coral .ts { fill: #D85A38; }

.blue rect { fill: #EBF3FE; stroke: #378ADD; }
.blue .th { fill: #185ABC; } .blue .ts { fill: #378ADD; }

.amber rect { fill: #FEF7E0; stroke: #B06000; }
.amber .th { fill: #7A4100; } .amber .ts { fill: #B06000; }

.flow-line { stroke: #444441; stroke-width: 1.5; fill: none; }
.flow-dashed { stroke: #5F5E5A; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
.lifeline { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
.frame-box { stroke: #378ADD; stroke-width: 1; stroke-dasharray: 4 4; fill: rgba(235,243,254,0.12); rx: 6px; }
.actor-line { stroke: #378ADD; stroke-width: 1.5; fill: none; stroke-linecap: round; }

@media (prefers-color-scheme: dark) {
  text { fill: #E3E1D8; }
  .ts { fill: #B4B2A9; }
  .lbl { fill: #B4B2A9; }
  .gray rect { fill: #2B2A27; stroke: #6B6963; }
  .gray .th { fill: #E3E1D8; } .gray .ts { fill: #B4B2A9; }
  
  .purple rect { fill: #26214A; stroke: #7F77DD; }
  .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
  
  .teal rect { fill: #053329; stroke: #3B9E7F; }
  .teal .th { fill: #9FE1CB; } .teal .ts { fill: #5DCAA5; }
  
  .coral rect { fill: #421A10; stroke: #E27B58; }
  .coral .th { fill: #F6B39E; } .coral .ts { fill: #F0997D; }
  
  .blue rect { fill: #0F2B4A; stroke: #669DF6; }
  .blue .th { fill: #AECBFA; } .blue .ts { fill: #8AB4F8; }
  
  .amber rect { fill: #3D2B03; stroke: #E3A024; }
  .amber .th { fill: #FDE293; } .amber .ts { fill: #FDD663; }
  
  .flow-line { stroke: #D3D1C7; }
  .flow-dashed { stroke: #B4B2A9; }
  .lifeline { stroke: #55544E; }
  .frame-box { stroke: #669DF6; fill: rgba(18,52,90,0.25); }
  .actor-line { stroke: #669DF6; }
}


.msg, .dot-amber, .cap { opacity: 0; }
.cap.static { opacity: 1; }
.dot-amber { fill: #EF9F27; stroke: #854F0B; stroke-width: 1.5; }
.step-badge { fill: #378ADD; stroke: #185ABC; stroke-width: 1; }
.badge-txt { font-size: 11px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }

@media (prefers-color-scheme: dark) {
  .dot-amber { stroke: #FAC775; }
  .step-badge { fill: #1A73E8; stroke: #8AB4F8; }
}

@media (prefers-reduced-motion: no-preference) {
  .cap.static { display: none; }
  .dot-amber { animation: dotSequence 15s linear infinite; }

  .m1 { animation: msgFade1 15s linear infinite; }
  .c1 { animation: capFade1 15s linear infinite; }
  .m2 { animation: msgFade2 15s linear infinite; }
  .c2 { animation: capFade2 15s linear infinite; }
  .m3 { animation: msgFade3 15s linear infinite; }
  .c3 { animation: capFade3 15s linear infinite; }
  .m4 { animation: msgFade4 15s linear infinite; }
  .c4 { animation: capFade4 15s linear infinite; }
  .m5 { animation: msgFade5 15s linear infinite; }
  .c5 { animation: capFade5 15s linear infinite; }

  @keyframes dotSequence {
    0% { opacity: 0; transform: translate(160px, 120px); }
    2% { opacity: 1; transform: translate(160px, 120px); }
    2.0% { transform: translate(160px, 120px); opacity: 1; }
    17.0% { transform: translate(300px, 120px); opacity: 1; }
    19.0% { transform: translate(300px, 165px); opacity: 1; }
    19.0% { transform: translate(300px, 165px); opacity: 1; }
    34.0% { transform: translate(440px, 165px); opacity: 1; }
    36.0% { transform: translate(440px, 210px); opacity: 1; }
    36.0% { transform: translate(440px, 210px); opacity: 1; }
    51.0% { transform: translate(300px, 210px); opacity: 1; }
    53.0% { transform: translate(300px, 255px); opacity: 1; }
    53.0% { transform: translate(300px, 255px); opacity: 1; }
    68.0% { transform: translate(580px, 255px); opacity: 1; }
    70.0% { transform: translate(580px, 300px); opacity: 1; }
    70.0% { transform: translate(580px, 300px); opacity: 1; }
    85.0% { transform: translate(160px, 300px); opacity: 1; }
    87.0% { transform: translate(160px, 300px); opacity: 1; }
    88% { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes msgFade1 {
    0%, 6.1% { opacity: 0.15; }
    7.1%, 88% { opacity: 1; }
    92%, 100% { opacity: 0.15; }
  }

  @keyframes msgFade2 {
    0%, 23.1% { opacity: 0.15; }
    24.1%, 88% { opacity: 1; }
    92%, 100% { opacity: 0.15; }
  }

  @keyframes msgFade3 {
    0%, 40.1% { opacity: 0.15; }
    41.1%, 88% { opacity: 1; }
    92%, 100% { opacity: 0.15; }
  }

  @keyframes msgFade4 {
    0%, 57.1% { opacity: 0.15; }
    58.1%, 88% { opacity: 1; }
    92%, 100% { opacity: 0.15; }
  }

  @keyframes msgFade5 {
    0%, 74.1% { opacity: 0.15; }
    75.1%, 88% { opacity: 1; }
    92%, 100% { opacity: 0.15; }
  }

  @keyframes capFade1 {
    0%, 1.0% { opacity: 0; }
    2.0%, 18.0% { opacity: 1; }
    19.0%, 100% { opacity: 0; }
  }

  @keyframes capFade2 {
    0%, 18.0% { opacity: 0; }
    19.0%, 35.0% { opacity: 1; }
    36.0%, 100% { opacity: 0; }
  }

  @keyframes capFade3 {
    0%, 35.0% { opacity: 0; }
    36.0%, 52.0% { opacity: 1; }
    53.0%, 100% { opacity: 0; }
  }

  @keyframes capFade4 {
    0%, 52.0% { opacity: 0; }
    53.0%, 69.0% { opacity: 1; }
    70.0%, 100% { opacity: 0; }
  }

  @keyframes capFade5 {
    0%, 69.0% { opacity: 0; }
    70.0%, 86.0% { opacity: 1; }
    87.0%, 100% { opacity: 0; }
  }
}
</style>

<defs>
<marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M8 1L2 5L8 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<polygon points="2,1 8,5 2,9" fill="#444441"/>
</marker>
<marker id="arr-inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
<polygon points="2,2 10,6 2,10" fill="#FFFFFF" stroke="#444441" stroke-width="1.5"/>
</marker>
</defs>

<rect class="frame-box" x="20" y="20" width="700" height="395"/><text class="th t-left" x="35" y="45">E-VISA VERIFICATION &amp; ISSUANCE SEQUENCE</text><g class="blue"><rect class="box" x="100" y="65" width="120" height="36"/><text class="th" x="160" y="83">VisaApplicant</text></g><line class="lifeline" x1="160" y1="101" x2="160" y2="365"/><g class="purple"><rect class="box" x="240" y="65" width="120" height="36"/><text class="th" x="300" y="83">VisaPortal</text></g><line class="lifeline" x1="300" y1="101" x2="300" y2="365"/><g class="teal"><rect class="box" x="380" y="65" width="120" height="36"/><text class="th" x="440" y="83">ImmigrationWatchlist</text></g><line class="lifeline" x1="440" y1="101" x2="440" y2="365"/><g class="coral"><rect class="box" x="520" y="65" width="120" height="36"/><text class="th" x="580" y="83">ConsularOfficer</text></g><line class="lifeline" x1="580" y1="101" x2="580" y2="365"/><g class="msg m1"><circle class="step-badge" cx="180" cy="112" r="9"/><text class="badge-txt" x="180" y="112">1</text><text class="ts" x="230.0" y="112">1: SubmitVisaApplication(passportData, travelDates)</text><line class="flow-line" x1="160" y1="120" x2="295" y2="120" marker-end="url(#arr-r)"/></g><g class="msg m2"><circle class="step-badge" cx="320" cy="157" r="9"/><text class="badge-txt" x="320" y="157">2</text><text class="ts" x="370.0" y="157">2: VerifyPassportValidity(passportNo)</text><line class="flow-line" x1="300" y1="165" x2="435" y2="165" marker-end="url(#arr-r)"/></g><g class="msg m3"><circle class="step-badge" cx="320" cy="202" r="9"/><text class="badge-txt" x="320" y="202">3</text><text class="ts" x="370.0" y="202">3: SecurityClearanceOutcome(noMatches)</text><line class="arr-res" x1="440" y1="210" x2="305" y2="210" stroke-dasharray="4 3" marker-end="url(#arr-l)"/></g><g class="msg m4"><circle class="step-badge" cx="320" cy="247" r="9"/><text class="badge-txt" x="320" y="247">4</text><text class="ts" x="440.0" y="247">4: ForwardToConsularOfficer(dossierID)</text><line class="flow-line" x1="300" y1="255" x2="575" y2="255" marker-end="url(#arr-r)"/></g><g class="msg m5"><circle class="step-badge" cx="180" cy="292" r="9"/><text class="badge-txt" x="180" y="292">5</text><text class="ts" x="370.0" y="292">5: TransmitElectronicVisaGrant(eVisaPDF)</text><line class="arr-res" x1="580" y1="300" x2="165" y2="300" stroke-dasharray="4 3" marker-end="url(#arr-l)"/></g><circle class="dot-amber" cx="0" cy="0" r="5"/><text class="ts cap static" x="370.0" y="390">Applicant submits international passport and travel dossier.</text><text class="th cap c1" x="370.0" y="390">Applicant submits international passport and travel dossier.</text><text class="th cap c2" x="370.0" y="390">VisaPortal runs automated check against immigration databases.</text><text class="th cap c3" x="370.0" y="390">Security clearance confirms applicant has no travel bans.</text><text class="th cap c4" x="370.0" y="390">Dossier forwarded to Consular Officer for final approval.</text><text class="th cap c5" x="370.0" y="390">Authenticated electronic visa grant document transmitted.</text></svg>